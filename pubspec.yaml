name: flutter_application_1
description: "Workack Attendance App"
publish_to: 'none'
version: 1.0.1+12


environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core Network & Utilities
  http: ^1.2.0
  intl: ^0.20.2
  logger: ^2.7.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  
  # UI & Media
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  
  # Hardware & Security
  camera: ^0.10.5
  google_mlkit_face_detection: ^0.13.2
  permission_handler: ^12.0.1
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.1.0
  geolocator: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/mockup_1.png
    - assets/images/mockup_2.png
    - assets/images/mockup_3.png
    - shorebird.yaml

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"